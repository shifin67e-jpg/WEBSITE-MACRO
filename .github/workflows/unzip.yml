name: Extract ZIP File

on:
  push:
    paths:
      - '**.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Unzip File
        run: |
          # Find any zip file matching 'webmacro-platform.zip' regardless of case
          ZIP_FILE=$(find . -maxdepth 2 -iname "*webmacro-platform*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Could not locate zip file in repository."
            ls -la
            exit 1
          fi

          echo "Found file: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE" -d ./
          rm "$ZIP_FILE"

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated unzip of Webmacro-platform" || exit 0
          git push
